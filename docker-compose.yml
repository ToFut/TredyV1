version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: chatme_postgres
    environment:
      POSTGRES_DB: peak1031_dev
      POSTGRES_USER: peak1031_user
      POSTGRES_PASSWORD: peak1031_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatme_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chatme_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatme_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatme_backend
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=postgresql://peak1031_user:peak1031_password@postgres:5432/peak1031_dev
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:8080
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - redis
    networks:
      - chatme_network
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: chatme_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api
      - NODE_ENV=production
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chatme_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: chatme_nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - chatme_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  chatme_network:
    driver: bridge 